services:
  postgres:
    image: postgres:16-alpine
    container_name: swingy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: swingy
      POSTGRES_USER: swingy
      POSTGRES_PASSWORD: swingy
    ports:
      - "5432:5432"
    volumes:
      - swingy-postgres-data:/var/lib/postgresql/data

volumes:
  swingy-postgres-data:
